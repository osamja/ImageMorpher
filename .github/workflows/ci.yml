name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: osamja/face-morpher-api
  LINODE_HOST: 173.255.217.39
  LINODE_PORT: 44444
  LINODE_USER: sammy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # dlib ships no wheels on PyPI, so `pip install dlib` compiles C++ from
      # source (~5 min on CI). Build the wheel once and cache it keyed only on
      # dlib + Python + OS. We use explicit restore/save (instead of the
      # combined cache action) so the wheel is persisted even when the job
      # FAILS — otherwise a failing run never saves the cache and the next run
      # recompiles dlib every time.
      - name: Restore compiled dlib wheel
        id: dlib-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/dlib-wheel
          key: dlib-wheel-${{ runner.os }}-py3.10-19.24.6

      # cmake/boost/gtk are only needed to compile dlib from source. On a cache
      # hit we install the prebuilt wheel directly, so skip this step entirely
      # (the wheel's runtime deps — BLAS/LAPACK/gfortran/X11/image libs — are
      # already present in the runner image).
      - name: Install system deps for dlib
        if: steps.dlib-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libboost-all-dev libgtk2.0-dev

      - name: Build dlib wheel
        id: build-dlib
        if: steps.dlib-cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip wheel
          pip wheel dlib==19.24.6 -w ~/dlib-wheel

      - name: Save compiled dlib wheel
        if: always() && steps.dlib-cache.outputs.cache-hit != 'true' && steps.build-dlib.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/dlib-wheel
          key: dlib-wheel-${{ runner.os }}-py3.10-19.24.6

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.10-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py3.10-

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install ~/dlib-wheel/dlib-*.whl
          pip install -r requirements.txt
          pip install 'dramatiq[redis, watch]==1.17.1' django_dramatiq psycopg2-binary 'pyjwt[crypto]'

      - name: Run tests
        env:
          SECRET_KEY: ci-test-key
        run: |
          mkdir -p morph/logs morph/content/temp_morphed_images
          touch morph/logs/morph-app-perf.log
          python manage.py test morph.tests
        working-directory: imagemorpher

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lint deps
        run: pip install pylint isort

      - name: Run isort check
        run: isort --check-only --diff imagemorpher/morph/ || true

      - name: Run pylint
        run: pylint imagemorpher/morph/ || true

  build-push:
    needs: [test, lint]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.LINODE_HOST }}
          port: ${{ env.LINODE_PORT }}
          username: ${{ env.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            set -e
            echo "=== Updating host checkout (source is bind-mounted into the containers) ==="
            cd ~/workspace/ImageMorpher
            git fetch origin master
            git checkout master
            git pull --ff-only origin master

            echo "=== Pulling latest image ==="
            docker pull ghcr.io/osamja/face-morpher-api:latest
            docker tag ghcr.io/osamja/face-morpher-api:latest face-morpher-api:latest

            echo "=== Redeploying face-morpher-api ==="
            cd ~/workspace/nginx_sammyjaved_proxy
            docker compose up -d face-morpher-api dramatiq_worker

            echo "=== Running migrations ==="
            docker exec nginx_sammyjaved_proxy-face-morpher-api-1 python manage.py migrate --noinput

            echo "=== Cleaning up old images ==="
            docker image prune -af

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify API health
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://pyaar.ai/morph/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed: HTTP $STATUS"
